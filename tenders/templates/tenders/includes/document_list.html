{% comment %}Expects `documents` — an iterable of TenderDocument, each with a non-null `document`.{% endcomment %}
<ul class="dhpl-docs-list dhpl-tender-docs-list">
  {% for doc in documents %}
  <li>
    <a href="{{ doc.document.url }}">
      <svg class="dhpl-doc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>{{ doc.title }}</span>
      {% if doc.document.file_size %}<span class="dhpl-doc-size">{{ doc.document.file_size|filesizeformat }}</span>{% endif %}
    </a>
  </li>
  {% endfor %}
</ul>
