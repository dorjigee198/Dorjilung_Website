{% load wagtailimages_tags %}
<div class="dhpl-board-card">
  <div class="dhpl-board-avatar" aria-hidden="true">
    {% if member.photo %}
      {% image member.photo fill-224x224 %}
    {% else %}
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    {% endif %}
  </div>
  <div class="dhpl-board-name">{{ member.name }}</div>
  <div class="dhpl-board-role">{{ member.designation }}</div>
</div>
