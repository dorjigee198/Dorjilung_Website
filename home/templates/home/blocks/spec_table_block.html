<div class="dhpl-spec-card">
  <h3 class="dhpl-spec-card-heading">{{ self.heading }}</h3>
  <table class="dhpl-spec-table">
    <tbody>
      {% for row in self.rows %}
      <tr>
        <th scope="row">{{ row.label }}</th>
        <td>{{ row.value }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
